<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="시간이 눈에 보이는 타이머. 제논 엣지 842×698 화면에 맞춘 터치 위젯.">
<title>TIME TIMER</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23000000'/%3E%3Ccircle cx='32' cy='32' r='23' fill='%230b1014'/%3E%3Cpath d='M32 13a19 19 0 1 1-19 19' fill='none' stroke='%23ed492d' stroke-width='7'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;font-family:"Segoe UI","Malgun Gothic",Arial,sans-serif;--blue:#aed1f6;--muted:#788b9c;--red:#ef4b30}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#000000;touch-action:manipulation}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation;user-select:none}
button:focus-visible,input:focus-visible{outline:2px solid #acd3ff;outline-offset:3px}
button:disabled{cursor:default}
#stage{position:absolute;width:842px;height:698px;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center}
.device{position:absolute;inset:0;border-radius:0;background:#000000;padding:0;box-shadow:none}
.screen{height:100%;position:relative;overflow:hidden;border-radius:0;background:#000000;box-shadow:none;color:var(--blue)}
.topbar{position:absolute;left:31px;right:25px;top:19px;display:flex;align-items:center;justify-content:space-between;height:37px;z-index:2}
.brand{display:flex;gap:9px;align-items:center;font-size:12px;letter-spacing:3px;color:#8796a1;font-weight:600}
.brand i{display:block;width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 8px #ed4b302c}
.audio-controls{display:flex;align-items:center;gap:8px}
.alarm-repeat{display:flex!important;align-items:center;justify-content:center;gap:5px;width:72px!important;font-variant-numeric:tabular-nums}
.alarm-repeat svg{width:23px!important;height:23px!important}
.alarm-repeat span{display:block;min-width:22px;text-align:center;font-size:20px;font-weight:600;line-height:1}
.alarm-repeat.infinite span{font-size:26px}
.zero-reset{display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.zero-reset svg{width:21px!important;height:21px!important}
.zero-reset span{font-size:11px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.sound{width:43px;height:40px;border:0;background:transparent;border-radius:12px;color:var(--blue);display:grid;place-items:center}
.sound.needs-attention{color:#ffb39c;box-shadow:inset 0 0 0 1px #ff876070}
.sound:hover{background:#ffffff09}
.sound svg{width:26px;height:26px}
.sound[aria-pressed="false"]{color:#637380}
.sound .muted-mark{display:none}
.sound[aria-pressed="false"] .sound-wave{display:none}
.sound[aria-pressed="false"] .muted-mark{display:block}
.dial{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:510px;height:510px;overflow:visible}
.tick{stroke:#65819c;stroke-width:1.3;opacity:.35}
.tick.major{stroke:#8cafcf;stroke-width:2;opacity:.65}
.dial-number{fill:var(--blue);font-family:"Segoe UI",Arial,sans-serif;font-weight:400;font-size:18px;text-anchor:middle;dominant-baseline:central;filter:drop-shadow(0 0 3px #82bcff24)}
.readout{position:absolute;top:188px;left:50%;transform:translateX(-50%);width:310px;display:flex;align-items:center;flex-direction:column;pointer-events:none}
.status{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;background:#18232c;border:1px solid #a9cfff12;border-radius:20px;color:#9eb7ce;font-size:11px;letter-spacing:1px}
.status i{width:4px;height:4px;background:currentColor;border-radius:50%}
.units{font-size:11px;letter-spacing:3px;color:#7d9ab4;height:29px;line-height:29px;padding-top:4px}
.digital{width:285px;height:90px;overflow:visible;filter:drop-shadow(0 0 3px #80bfff50)}
.digit-on{fill:#b4d8fb}
.digit-off{fill:#17232d;opacity:.48}
.scale-label{margin-top:18px;font-size:13px;color:#6e8498;letter-spacing:.2px}
.settings{position:absolute;top:548px;left:28px;right:28px;display:flex;align-items:center;justify-content:center;gap:18px}
.setting-label{color:#8797a4;font-size:14px;margin-right:5px;white-space:nowrap}
.stepper{display:flex;align-items:center;background:#141c23;border:1px solid #243039;border-radius:14px;height:58px;overflow:hidden}
.stepper button{border:0;background:transparent;color:#9eb7cd;width:52px;height:56px;font-size:26px;line-height:1}
.stepper button:hover{background:#ffffff08}
.value{display:flex;align-items:baseline;justify-content:center;min-width:88px;gap:5px}
.value input{appearance:textfield;-moz-appearance:textfield;width:39px;padding:0;text-align:center;color:#c0d8ed;border:0;background:transparent;font-family:"Segoe UI",Arial,sans-serif;font-size:25px;font-variant-numeric:tabular-nums;outline-offset:0}
.value input::-webkit-outer-spin-button,.value input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.value span{color:#788d9f;font-size:12px}
.stepper.locked{opacity:.48}
.stepper button:disabled:hover{background:transparent}
.actions{position:absolute;top:626px;left:28px;right:28px;display:flex;gap:12px;height:56px;align-items:stretch}
.presets{display:flex;gap:10px;flex:1}
.preset{flex:1;min-width:0;border:1px solid #28343d;border-radius:14px;background:#111a21;color:#bad2e7;font-size:16px;padding:0 12px}
.preset:hover:not(:disabled){background:#1b2934}
.preset:disabled{opacity:.4}
.reset{width:60px;display:grid;place-items:center;flex-shrink:0;border:1px solid #34424c;background:#19232b;border-radius:14px;color:#b3cadb}
.reset:hover{background:#25343f}
.reset svg{width:22px;height:22px}
.start{border:1px solid #fb6b4c;background:linear-gradient(#ff522f,#f73513);border-radius:15px;min-width:250px;padding:0 25px;display:flex;gap:11px;align-items:center;justify-content:center;color:#fff4ed;font-weight:600;font-size:16px;letter-spacing:1px;box-shadow:inset 0 1px #ffffff26,0 3px 10px #0003}
.start:hover{filter:brightness(1.08)}
.start:active,.reset:active,.preset:active{transform:translateY(1px)}
.start svg{width:18px;height:18px}
.start .pause-icon{display:none}
.running .start{background:linear-gradient(#263a49,#1c2c38);border-color:#42617a;color:#c4dcef}
.running .start .play-icon{display:none}
.running .start .pause-icon{display:block}
.running .status{color:#b5cfe5}
.paused .status{color:#edbd82;background:#30291e;border-color:#e6b16b20}
.done .status{color:#ffb39c;background:#382018;border-color:#ff876020}
.done .digital{filter:drop-shadow(0 0 7px #9ecaff80)}
.done .status{box-shadow:0 0 16px #e64a2022}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:#26313b;border:1px solid #53697a;border-radius:12px;padding:11px 17px;font-size:13px;color:#dae9f7;opacity:0;pointer-events:none;transition:opacity .15s;white-space:nowrap;z-index:5}
.toast.visible{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}
}

</style>
</head>
<body>
<main id="stage" aria-label="타임타이머">
 <section class="device" id="device" aria-label="시간이 보이는 타이머">
  <div class="screen">
   
<header class="topbar"><div class="brand"><i></i>TIME TIMER</div><div class="audio-controls"><button class="sound alarm-repeat" id="alarmRepeat" type="button" aria-label="알람 반복 1회, 클릭하여 변경" title="알람 1회 · 클릭하여 횟수 변경"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg><span id="alarmRepeatCount" aria-hidden="true">1</span></button><button class="sound" id="sound" type="button" aria-label="알림 소리 끄기" aria-pressed="true" title="알림 소리 끄기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4 5 8H2v8h3l5 4z" fill="currentColor" stroke="none"/><path class="sound-wave" d="M14 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="muted-mark" d="m15 9 6 6m0-6-6 6"/></svg></button></div></header>

   <svg class="dial" id="dial" viewBox="0 0 420 420" aria-hidden="true"><defs><filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4"/></filter></defs><g id="ticks"></g><g id="numbers"></g><path id="gaugeGlow" fill="#ef4b30" opacity=".18" filter="url(#redGlow)"/><path id="gaugeTrack" fill="#291917"/><path id="gauge" fill="#c82105"/><g id="seams"></g></svg>

   <div class="readout"><div class="status"><i></i><span id="status">준비</span></div><div class="units" id="units">MIN&nbsp;&nbsp; SEC</div><svg class="digital" id="digital" viewBox="0 0 188 68" aria-hidden="true"></svg><output id="timeText" class="sr-only" role="timer" aria-live="off">45분 00초</output><div class="scale-label" id="scaleLabel">한 바퀴 60분</div></div>

   <div class="settings"><span class="setting-label">시간 설정</span><div class="stepper" id="hourStepper"><button type="button" data-step="hours:-1" aria-label="1시간 줄이기">−</button><label class="value"><input id="hours" type="number" inputmode="numeric" min="0" max="99" step="1" value="0" aria-label="설정 시간"><span>시간</span></label><button type="button" data-step="hours:1" aria-label="1시간 늘리기">+</button></div><div class="stepper" id="minuteStepper"><button type="button" data-step="minutes:-1" aria-label="1분 줄이기">−</button><label class="value"><input id="minutes" type="number" inputmode="numeric" min="0" max="59" step="1" value="45" aria-label="설정 분"><span>분</span></label><button type="button" data-step="minutes:1" aria-label="1분 늘리기">+</button></div></div>

   <div class="actions"><div class="presets" aria-label="시간 빠르게 추가"><button class="preset" type="button" data-add-minutes="5" aria-label="5분 추가">+5분</button><button class="preset" type="button" data-add-minutes="10" aria-label="10분 추가">+10분</button><button class="preset" type="button" data-add-minutes="30" aria-label="30분 추가">+30분</button></div><button class="reset" id="reset" type="button" aria-label="설정한 시간으로 초기화" title="설정한 시간으로 초기화"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg></button><button class="reset zero-reset" id="clearTime" type="button" aria-label="시간을 00:00으로 초기화" title="시간을 00:00으로 초기화"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 3 6 6-10 10H5l-3-3L15 3ZM8 10l6 6m-3 3h10"/></svg><span aria-hidden="true">00:00</span></button><button class="start" id="start" type="button"><svg class="play-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M5 3.4c0-.8.8-1.2 1.5-.8l10 6.5c.6.4.6 1.3 0 1.7l-10 6.6c-.7.4-1.5 0-1.5-.8z"/></svg><svg class="pause-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg><span id="startText">시작</span></button></div>
   <div class="toast" id="toast" role="status"></div><div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  </div>
 </section>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg',KEY='imji-time-timer-v1',MAX=5999*60000;
const elements={stage:$('stage'),device:$('device'),hours:$('hours'),minutes:$('minutes'),gauge:$('gauge'),glow:$('gaugeGlow'),digital:$('digital')};
const defaults=()=>({version:1,totalMs:45*60000,remainingMs:45*60000,endAt:null,mode:'idle',sound:true,alarmRepeats:1});
let state=defaults(),lastSeconds=-1,lastScale=-1,audio=null,toastTimeout=null;
function restored(raw){try{const s=JSON.parse(raw);if(!s||s.version!==1||!['idle','running','paused','done'].includes(s.mode)||!Number.isFinite(s.totalMs)||s.totalMs<0||s.totalMs>MAX||!Number.isFinite(s.remainingMs)||s.remainingMs<0||s.remainingMs>s.totalMs)return null;if(s.mode==='running'&&(!Number.isFinite(s.endAt)||s.totalMs===0))return null;return{version:1,totalMs:s.totalMs,remainingMs:s.remainingMs,endAt:s.mode==='running'?s.endAt:null,mode:s.mode,sound:s.sound!==false,alarmRepeats:Number.isInteger(s.alarmRepeats)&&s.alarmRepeats>=0&&s.alarmRepeats<=9?s.alarmRepeats:1};}catch{return null;}}
try{state=restored(localStorage.getItem(KEY))||defaults();}catch{}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{}}
function remaining(now=Date.now()){return state.mode==='running'?Math.max(0,Math.min(state.totalMs,state.endAt-now)):state.remainingMs;}
function svg(tag,attrs,parent){const n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,String(v)));if(parent)parent.append(n);return n;}
function pt(r,a){const t=(a-90)*Math.PI/180;return[210+r*Math.cos(t),210+r*Math.sin(t)];}
function ring(f){if(f<=0)return '';const a=Math.min(f,1)*360;const o=pt(153,a),i=pt(122,a);if(f>=1)return'M210 57 A153 153 0 1 1 210 363 A153 153 0 1 1 210 57 L210 88 A122 122 0 1 0 210 332 A122 122 0 1 0 210 88 Z';return`M210 57 A153 153 0 ${a>180?1:0} 1 ${o[0]} ${o[1]} L${i[0]} ${i[1]} A122 122 0 ${a>180?1:0} 0 210 88 Z`;}
$('gaugeTrack').setAttribute('d',ring(1));
for(let n=0;n<60;n++){let a=n*6,p=pt(n%5===0?161:163,a),q=pt(167,a);svg('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],class:'tick'+(n%5===0?' major':'')},$('ticks'));p=pt(122,a);q=pt(153,a);svg('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:'#090e12','stroke-width':1.65,opacity:.78},$('seams'));}
function scale(){return Math.max(3600000,state.totalMs);}
function scaleNumbers(){const s=scale();if(s===lastScale)return;lastScale=s;$('numbers').replaceChildren();for(let n=0;n<12;n++){const p=pt(187,n*30),secs=s/1000*n/12;let label;if(s<=3600000)label=String(n*5);else{const mins=Math.round(secs/60);label=n===0?'0':Math.floor(mins/60)+':'+String(mins%60).padStart(2,'0');}const el=svg('text',{x:p[0],y:p[1],class:'dial-number','font-size':s>3600000?'14':'18'},$('numbers'));if(s>3600000)el.style.fontSize='14px';el.textContent=label;}$('scaleLabel').textContent=s<=3600000?'한 바퀴 60분':'한 바퀴 '+duration(s);}
function duration(ms){const m=Math.round(ms/60000),h=Math.floor(m/60);return(h?h+'시간':'')+(h&&m%60?' ':'')+(!h||m%60?m%60+'분':'');}
const segments = [
  '7,2 29,2 33,6 29,10 7,10 3,6',          // 위
  '30,10 35,7 35,29 31,33 27,29 27,15',    // 오른쪽 위
  '30,60 35,63 35,41 31,37 27,41 27,55',   // 오른쪽 아래
  '7,68 29,68 33,64 29,60 7,60 3,64',      // 아래
  '6,60 1,63 1,41 5,37 9,41 9,55',        // 왼쪽 아래
  '6,10 1,7 1,29 5,33 9,29 9,15',         // 왼쪽 위
  '8,31 28,31 32,35 28,39 8,39 4,35'      // 가운데
];
const maps={0:'abcdef',1:'bc',2:'abdeg',3:'abcdg',4:'bcfg',5:'acdfg',6:'acdefg',7:'abc',8:'abcdefg',9:'abcdfg'};
function digits(sec){const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;const val=h?String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'):String(Math.floor(sec/60)).padStart(2,'0')+':'+String(s).padStart(2,'0');elements.digital.replaceChildren();let x=0;for(const c of val){const g=svg('g',{transform:`translate(${x},0)`},elements.digital);if(c===':'){svg('rect',{x:3,y:19,width:5,height:5,rx:1,fill:'#b4d8fb'},g);svg('rect',{x:3,y:46,width:5,height:5,rx:1,fill:'#b4d8fb'},g);x+=16;}else{segments.forEach((points,j)=>svg('polygon',{points,class:maps[c].includes('abcdefg'[j])?'digit-on':'digit-off'},g));x+=43;}}elements.digital.setAttribute('viewBox',`0 0 ${x-7} 70`);$('units').textContent=h?'HOUR   MIN   SEC':'MIN     SEC';$('timeText').textContent=(h?h+'시간 ':'')+m+'분 '+s+'초';document.title=val+' · 타임타이머';}
function syncAlarmRepeats(){
 const count=state.alarmRepeats===0?'∞':String(state.alarmRepeats);
 const label=state.alarmRepeats===0?'알람 무한 반복':'알람 '+count+'회';
 $('alarmRepeatCount').textContent=count;
 $('alarmRepeat').classList.toggle('infinite',state.alarmRepeats===0);
 $('alarmRepeat').setAttribute('aria-label',label+', 클릭하여 변경');
 $('alarmRepeat').title=label+' · 클릭하여 횟수 변경';
}
function cycleAlarmRepeats(){
 state.alarmRepeats=state.alarmRepeats===9?0:state.alarmRepeats+1;
 // 0은 무한 반복. 횟수를 줄이면 이미 완료한 재생 횟수도 반영합니다.
 if(alarmActive&&state.alarmRepeats!==0&&alarmCompleted>=state.alarmRepeats)silence();
 persist();syncAlarmRepeats();
 // notify(state.alarmRepeats===0?'알람 무한 반복':'알람 '+state.alarmRepeats+'회 재생');
}
function syncUI(){elements.device.className='device '+state.mode;elements.hours.value=Math.floor(state.totalMs/3600000);elements.minutes.value=Math.floor(state.totalMs/60000)%60;const locked=state.mode==='running'||state.mode==='paused';document.querySelectorAll('[data-step],#hours,#minutes').forEach(el=>el.disabled=locked);$('hourStepper').classList.toggle('locked',locked);$('minuteStepper').classList.toggle('locked',locked);$('status').textContent={idle:'준비',running:'집중 중',paused:'일시정지',done:'시간 종료'}[state.mode];$('startText').textContent={idle:'시작',running:'일시정지',paused:'계속',done:'다시 시작'}[state.mode];$('start').setAttribute('aria-label',$('startText').textContent);syncSoundUI();syncAlarmRepeats();lastSeconds=-1;scaleNumbers();render();}
function render(){const ms=remaining();if(state.mode==='running'&&ms<=0){finish(true);return;}const sec=Math.ceil(ms/1000);if(sec!==lastSeconds){lastSeconds=sec;digits(sec);}const d=ring(ms/scale());elements.gauge.setAttribute('d',d);elements.glow.setAttribute('d',d);}

 const label = waiting ? '알람 재생 다시 시도' : (state.sound ? '알림 소리 끄기' : '알림 소리 켜기');
 $('sound').setAttribute('aria-pressed', String(state.sound));
 $('sound').setAttribute('aria-label', label);
 $('sound').title = label;
 $('sound').classList.toggle('needs-attention', waiting);
 $('status').textContent = waiting && state.mode === 'done'
  ? '알림 대기 · 소리 버튼 터치'
  : {idle:'준비', running:'집중 중', paused:'일시정지', done:'시간 종료'}[state.mode];
}

function audioContext() {
 if(audio && audio.state !== 'closed') return audio;
 const AC = window.AudioContext || window.webkitAudioContext;
 if(!AC) throw new Error('Web Audio를 지원하지 않습니다.');
 audio = new AC();
 const context = audio;
 context.addEventListener('statechange', () => {
  if(context !== audio || !alarmActive || alarmBackend !== 'web') return;
  if(context.state !== 'running') {
   // 연결 변경/다른 오디오에 의한 일시 중단을 완료된 재생으로 세지 않습니다.
   alarmFailure(alarmGeneration, new Error('알림 오디오가 일시 중단되었습니다.'));
  }
 });
 return audio;
}

function decodedAlarm(context) {
 if(alarmBuffer) return Promise.resolve(alarmBuffer);
 if(!alarmDecodeTask) {
  // 네트워크 요청 없이 기존에 내장된 MP3 바이트를 디코딩합니다.
  alarmDecodeTask = Promise.resolve().then(() => {
   const binary = atob(ALARM_URL.slice(ALARM_URL.indexOf(',') + 1));
   const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
   return context.decodeAudioData(bytes.buffer);
  }).then(buffer => { alarmBuffer = buffer; return buffer; })
   .catch(error => { alarmDecodeTask = null; throw error; });
 }
 return alarmDecodeTask;
}

function unlockAudio() {
 // resume()는 await 이전, 사용자 클릭 이벤트 안에서 호출해야 합니다.
 try {
  const context = audioContext();
  if(context.state !== 'running') void context.resume().catch(() => {});
  void decodedAlarm(context).catch(() => {});
 } catch {} // 지원/디코딩 오류는 실제 재생 시 예비 경로로 처리합니다.
}

function withAudioTimeout(promise) {
 return new Promise((resolve, reject) => {
  const id = setTimeout(() => {
   const error = new Error('오디오 준비 시간이 초과되었습니다.');
   error.name = 'TimeoutError';
   reject(error);
  }, 1800);
  Promise.resolve(promise).then(
   value => { clearTimeout(id); resolve(value); },
   error => { clearTimeout(id); reject(error); }
  );
 });
}

function stopAlarmPlayback() {
 alarmBackend = '';
 if(alarmSource) {
  const source = alarmSource;
  alarmSource = null;
  source.onended = null;
  try { source.stop(); } catch {}
  source.disconnect();
 }
 alarmSound.pause();
 try { alarmSound.currentTime = 0; } catch {}
}

function alarmFailure(generation, error) {
 if(generation !== alarmGeneration || !alarmActive) return;
 stopAlarmPlayback();
 alarmAttention = true;
 alarmNeedsGesture = error && error.name === 'NotAllowedError';
 syncSoundUI();
 clearTimeout(alarmRetryTimer);
 alarmRetryTimer = null;
 if(!alarmNeedsGesture && alarmRetries < MAX_ALARM_RETRIES) {
  alarmRetries++;
  alarmRetryTimer = setTimeout(() => {
   alarmRetryTimer = null;
   void playAlarmOnce(generation);
  }, 400 * alarmRetries);
 } else {
  // 차단된 알람을 버리지 않고 사용자가 기존 소리 버튼으로 재시도할 수 있게 둡니다.
  console.warn('알림 재생 대기:', error);
  notify('알람 재생이 멈췄습니다. 우측 소리 버튼을 눌러 주세요.');
 }
}

async function playAlarmOnce(generation) {
 if(generation !== alarmGeneration || !alarmActive || !state.sound ||
    alarmAttempting || alarmBackend) return;
 alarmAttempting = true;
 try {
  try {
   const context = audioContext();
   const resumed = context.state === 'running' ? Promise.resolve() : context.resume();
   const [, buffer] = await withAudioTimeout(Promise.all([resumed, decodedAlarm(context)]));
   if(generation !== alarmGeneration || !alarmActive) return;
   if(context.state !== 'running') throw new Error('오디오가 일시 중단되어 있습니다.');
   const source = context.createBufferSource();
   source.buffer = buffer;
   source.loop = false;
   source.connect(context.destination);
   alarmSource = source;
   alarmBackend = 'web';
   source.onended = () => {
    if(generation !== alarmGeneration || alarmSource !== source) return;
    source.disconnect();
    alarmSource = null;
    alarmBackend = '';
    alarmEnded(generation);
   };
   source.start();
  } catch(error) {
   if(generation !== alarmGeneration || !alarmActive) return;
   stopAlarmPlayback();
   // 두 경로를 동시에 재생하지 않습니다. Web Audio 실패 시에만 예비 경로 사용.
   alarmSound.currentTime = 0;
   alarmBackend = 'media';
   await withAudioTimeout(alarmSound.play());
   if(generation !== alarmGeneration || !alarmActive) return;
  }
  alarmAttention = false;
  alarmNeedsGesture = false;
  syncSoundUI();
 } catch(error) {
  alarmFailure(generation, error);
 } finally {
  if(generation === alarmGeneration) alarmAttempting = false;
 }
}

function alarmEnded(generation) {
 if(generation !== alarmGeneration || !alarmActive) return;
 alarmCompleted++;
 alarmRetries = 0;
 if(state.sound && state.mode === 'done' &&
    (state.alarmRepeats === 0 || alarmCompleted < state.alarmRepeats)) {
  void playAlarmOnce(generation);
 } else silence();
}

function beep() {
 silence();
 if(!state.sound) return;
 alarmActive = true;
 void playAlarmOnce(alarmGeneration);
}

function silence() {
 alarmGeneration++;
 alarmActive = false;
 alarmCompleted = 0;
 alarmAttempting = false;
 alarmAttention = false;
 alarmNeedsGesture = false;
 alarmRetries = 0;
 clearTimeout(alarmRetryTimer);
 alarmRetryTimer = null;
 stopAlarmPlayback();
 syncSoundUI();
}

function retryAlarmFromGesture() {
 unlockAudio();
 if(!alarmActive || !alarmAttention) return;
 alarmRetries = 0;
 alarmNeedsGesture = false;
 clearTimeout(alarmRetryTimer);
 alarmRetryTimer = null;
 void playAlarmOnce(alarmGeneration);
}

alarmSound.addEventListener('ended', () => {
 if(!alarmActive || alarmBackend !== 'media' || !alarmSound.ended) return;
 alarmBackend = '';
 alarmEnded(alarmGeneration);
});
alarmSound.addEventListener('error', () => {
 if(alarmActive && alarmBackend === 'media' && !alarmAttempting)
  alarmFailure(alarmGeneration, new Error('알림 음원을 재생하지 못했습니다.'));
});
alarmSound.addEventListener('pause', () => {
 if(alarmActive && alarmBackend === 'media' && !alarmSound.ended && !alarmAttempting)
  alarmFailure(alarmGeneration, new Error('알림 재생이 일시 중단되었습니다.'));
});

function recoverAudio() {
 if(document.hidden) return;
 if(state.mode === 'running' || alarmActive) unlockAudio();
 render();
 if(alarmActive && !alarmBackend && !alarmAttempting && !alarmRetryTimer &&
    !alarmNeedsGesture && alarmRetries < MAX_ALARM_RETRIES) {
  void playAlarmOnce(alarmGeneration);
 }
}

function finish(audible) {
 if(state.mode==='done')return;
 state.mode='done';
 state.remainingMs=0;
 state.endAt=null;
 persist();syncUI();
 $('announcer').textContent='설정한 시간이 끝났습니다.';
 silence();
 if(audible&&state.sound)beep();
}

function setDuration(ms){silence();state.totalMs=Math.max(0,Math.min(MAX,Math.round(ms/60000)*60000));state.remainingMs=state.totalMs;state.endAt=null;state.mode='idle';persist();syncUI();}
function addMinutes(minutes){
 if(state.mode==='idle')applyFields();
 const now=Date.now(),left=remaining(now),expired=state.mode==='done'||(state.mode==='running'&&left<=0);
 const base=expired?0:state.totalMs,added=Math.min(minutes*60000,MAX-base);
 if(added<=0){notify('최대 99시간 59분까지 설정할 수 있어요.');return;}
 silence();
 state.totalMs=base+added;state.remainingMs=(expired?0:left)+added;
 if(state.mode==='running'&&!expired){state.endAt=now+state.remainingMs;}else{state.endAt=null;if(expired)state.mode='idle';}
 persist();syncUI();$('announcer').textContent=duration(added)+' 추가했습니다.';
}
function applyFields(){if(state.mode==='running'||state.mode==='paused')return;const h=Math.min(99,Math.max(0,Math.floor(Number(elements.hours.value)||0))),m=Math.min(59,Math.max(0,Math.floor(Number(elements.minutes.value)||0)));setDuration((h*60+m)*60000);}
function toggle(){unlockAudio();silence();if(state.mode==='running'){const left=remaining();if(left<=0){finish(true);return;}state.remainingMs=left;state.endAt=null;state.mode='paused';}else{if(state.mode==='idle')applyFields();if(state.mode==='done')state.remainingMs=state.totalMs;if(state.remainingMs<=0){notify('1분 이상 설정해 주세요.');return;}state.endAt=Date.now()+state.remainingMs;state.mode='running';}persist();syncUI();}
$('clearTime').addEventListener('click',()=>{
 setDuration(0);
 $('announcer').textContent='시간을 00:00으로 초기화했습니다.';
 // notify('시간을 00:00으로 초기화했습니다.');
});
$('alarmRepeat').addEventListener('click',cycleAlarmRepeats);
$('start').addEventListener('click',toggle);$('reset').addEventListener('click',()=>{setDuration(state.totalMs);$('announcer').textContent='설정한 시간으로 초기화했습니다.';});$('sound').addEventListener('click',()=>{if(alarmActive&&alarmAttention){retryAlarmFromGesture();return;}unlockAudio();state.sound=!state.sound;if(!state.sound)silence();persist();syncUI();notify(state.sound?'종료 알림 소리 켜짐':'종료 알림 소리 꺼짐');});
document.querySelectorAll('[data-step]').forEach(el=>el.addEventListener('click',()=>{if(state.mode==='running'||state.mode==='paused')return;const[key,delta]=el.dataset.step.split(':');const input=elements[key],max=key==='hours'?99:59;input.value=Math.max(0,Math.min(max,Number(input.value)+Number(delta)));applyFields();}));
document.querySelectorAll('[data-add-minutes]').forEach(el=>el.addEventListener('click',()=>addMinutes(Number(el.dataset.addMinutes))));
[elements.hours,elements.minutes].forEach(el=>{el.addEventListener('change',applyFields);el.addEventListener('focus',()=>el.select());el.addEventListener('keydown',e=>{if(e.key==='Enter'){applyFields();el.blur();}});});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();toggle();}});
window.addEventListener('storage',e=>{if(e.key!==KEY)return;const saved=restored(e.newValue);if(saved){silence();state=saved;if(state.mode==='running'&&remaining()===0)finish(false);else syncUI();}});
window.addEventListener('pagehide',persist);document.addEventListener('visibilitychange',recoverAudio);window.addEventListener('focus',recoverAudio);
function resize(){const s=Math.min(window.innerWidth/842,window.innerHeight/698);elements.stage.style.transform=`translate(-50%,-50%) scale(${s})`;}
window.addEventListener('resize',resize);resize();
// 실행 중 위젯이 다시 로드된 직후 만료됐다면 알람을 누락하지 않습니다.
// 오래전에 끝난 타이머를 다시 열었을 때 울리지 않도록 60초 이내만 복구합니다.
if(state.mode==='running'&&remaining()===0)finish(Date.now()-state.endAt<=60000);
else {syncUI();if(state.mode==='running'&&state.sound)unlockAudio();}
setInterval(render,100);
})();
</script>
</body>
</html>
